<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joan Sebastian Salazar Montoya</title>
<meta name="description" content="Joan Sebastian Salazar Montoya: estudiante de matemáticas y ciencias de la computación en la Universidad Nacional de Colombia, líder del semillero AtarraIA.">
<style>
  @font-face { font-family: "KaTeX_Main"; src: url(fonts/KaTeX_Main-Regular.woff2) format("woff2"); font-style: normal; font-weight: 400; }
  @font-face { font-family: "KaTeX_Main"; src: url(fonts/KaTeX_Main-Italic.woff2) format("woff2"); font-style: italic; font-weight: 400; }

  :root {
    color-scheme: light;
    --page: #ffffff;
    --ink: #1b1d22;
    --soft: #5d636c;
    --muted: #8a919b;
    --line: #1b1d221c;
    --tint: #f7f7f5;
    --highlight: #e56a00;
    --highlight-soft: #f2730512;
    --serif: "KaTeX_Main", "Latin Modern Roman", "Iowan Old Style", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--page); color: var(--ink); margin: 0; }
  body { font-family: var(--serif); padding: 0 16px; padding-block: 9vh 8vh; }
  .wrap { max-width: 72rem; margin: 0 auto; }

  header { max-width: 44rem; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin: 0 0 1rem; }
  .topbar .eyebrow { margin: 0; }
  .lang-toggle { font-family: var(--sans); font-size: 13px; letter-spacing: .08em; color: var(--soft); background: none; border: 1px solid var(--line); border-radius: 999px; padding: .3rem .75rem; cursor: pointer; }
  .lang-toggle:hover { color: var(--highlight); border-color: var(--highlight); }
  .lang-toggle:focus-visible { outline: 2px solid #f2730580; outline-offset: 2px; }
  .eyebrow { font-family: var(--sans); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }
  h1 { font-weight: 400; font-size: clamp(40px, 6vw, 76px); line-height: 1.02; margin: 0; letter-spacing: -.01em; }
  h1 i { color: var(--highlight); }
  .lead { font-size: clamp(19px, 1.9vw, 25px); line-height: 1.45; color: var(--soft); margin: 1rem 0 0; text-wrap: pretty; }
  .lead a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .lead a:hover { color: var(--highlight); border-color: var(--highlight); }
  .profile { font-family: var(--sans); font-size: 14px; margin-top: 1.2rem; display: flex; gap: .4rem 1.2rem; flex-wrap: wrap; }
  .profile a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .profile a:hover { color: var(--highlight); border-color: var(--highlight); }

  nav.topics { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(6px);
    margin: 3.5rem -16px 0; padding: .8rem 16px; border-bottom: 1px solid var(--line); display: flex; gap: .4rem; flex-wrap: wrap; font-family: var(--sans); font-size: 14px; }
  nav.topics a { color: var(--soft); text-decoration: none; padding: .3rem .75rem; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  nav.topics a:hover { color: var(--highlight); border-color: var(--highlight); }
  nav.topics .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: .3rem; }

  section { margin-top: 3.2rem; scroll-margin-top: 4.5rem; }
  section > h2 { font-weight: 400; font-size: clamp(26px, 2.6vw, 36px); margin: 0; display: flex; align-items: baseline; gap: .6rem; }
  section > h2 .n { font-family: var(--sans); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  section > p.blurb { color: var(--soft); font-size: 18px; margin: .3rem 0 0; max-width: 44rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: 1rem; margin-top: 1.2rem; }
  .card { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; background: var(--page); transition: border-color .2s; }
  .card .body { padding: 1.1rem 1.2rem 1rem; display: flex; flex-direction: column; gap: .55rem; flex: 1; }
  .shot { display: block; aspect-ratio: 16 / 10; background: var(--tint); border-bottom: 1px solid var(--line); overflow: hidden; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform .4s ease; }
  .card:hover .shot img { transform: scale(1.03); }
  .card:hover { border-color: #1b1d2240; }
  .card.featured { border-top: 3px solid var(--highlight); }
  .card h3 { font-weight: 400; font-size: 23px; line-height: 1.2; margin: 0; overflow-wrap: anywhere; }
  .card p { margin: 0; font-size: 17px; line-height: 1.45; color: var(--soft); flex: 1; }
  .meta { font-family: var(--sans); font-size: 13px; color: var(--muted); display: flex; gap: .35rem .9rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .links { font-family: var(--sans); font-size: 14px; display: flex; gap: 1rem; margin-top: .2rem; }
  .links a { text-decoration: none; color: var(--soft); }
  .links a.site { color: var(--highlight); font-weight: 500; }
  .links a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .links a:focus-visible, .lead a:focus-visible, nav.topics a:focus-visible, .profile a:focus-visible { outline: 2px solid #f2730580; outline-offset: 2px; border-radius: 3px; }

  footer { margin-top: 4.5rem; padding-top: 1.2rem; border-top: 1px solid var(--line); font-family: var(--sans); font-size: 13px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p class="eyebrow">Extantword</p>
    <button type="button" class="lang-toggle" id="lang-toggle"></button>
  </div>
  <header>
    <h1>Joan Sebastian Salazar Montoya<i>.</i></h1>
    <p class="lead" id="lead"></p>
    <div class="profile">
      <a href="https://github.com/Extantword">github.com/Extantword</a>
      <a href="https://extantword.github.io/joan.github.io/">Blog</a>
    </div>
  </header>

  <nav class="topics" id="topics"></nav>
  <main id="groups"></main>

</div>

<script>
  // Every visible string comes in Spanish and English; the button switches between them.
  const TEXT = {
    es: {
      lead: 'Soy un estudiante de pregrado en matemáticas y ciencias de la computación en la Universidad Nacional de Colombia. Soy el líder del semillero {atarraia}. Me interesan muchas cosas, entre ellas la geometría, la topología, el deep learning y las interfaces gráficas.',
      description: 'Joan Sebastian Salazar Montoya: estudiante de matemáticas y ciencias de la computación en la Universidad Nacional de Colombia, líder del semillero AtarraIA.',
      topics: 'Temas', site: 'Ver sitio ↗', code: 'Código', preview: 'Vista previa de ', toggle: 'EN', toggleLabel: 'Read this page in English',
    },
    en: {
      lead: 'I am an undergraduate student in mathematics and computer science at the Universidad Nacional de Colombia. I lead the {atarraia} research group. I am interested in many things, among them geometry, topology, deep learning and graphical interfaces.',
      description: 'Joan Sebastian Salazar Montoya: mathematics and computer science student at the Universidad Nacional de Colombia, leader of the AtarraIA research group.',
      topics: 'Topics', site: 'Visit site ↗', code: 'Code', preview: 'Preview of ', toggle: 'ES', toggleLabel: 'Ver la página en español',
    },
  };

  const ATARRAIA = { es: 'https://atarraia.github.io/', en: 'https://atarraia.github.io/?lang=en' };

  // Curated list. `site` is the live page and `preview` a screenshot of it, in previews/.
  const GROUPS = [
    { id: 'matematicas', title: { es: 'Matemáticas', en: 'Mathematics' },
      blurb: { es: 'Geometría diferencial y sistemas dinámicos, como algo que se puede mirar y tocar.', en: 'Differential geometry and dynamical systems, as something you can look at and touch.' }, repos: [
      { name: 'diff-geo', title: { es: 'Geometría diferencial interactiva', en: 'Interactive differential geometry' }, featured: true,
        site: 'https://extantword.github.io/diff-geo/', preview: 'previews/diff-geo.webp' },
      { name: 'interactive-diff-geo', title: { es: 'Superficies regulares', en: 'Regular surfaces' }, featured: true,
        site: 'https://extantword.github.io/interactive-diff-geo/', preview: 'previews/interactive-diff-geo.webp' },
      { name: 'sandbox', title: { es: 'Sandbox', en: 'Sandbox' }, featured: true,
        site: 'https://extantword.github.io/sandbox/', preview: 'previews/sandbox.webp' },
    ]},
    { id: 'aprendizaje', title: { es: 'Aprendizaje automático', en: 'Machine learning' },
      blurb: { es: 'Redes neuronales, su espacio latente y el semillero AtarraIA.', en: 'Neural networks, their latent space and the AtarraIA research group.' }, repos: [
      { name: 'activation-space-projections', title: { es: 'Proyecciones del espacio latente', en: 'Latent space projections' }, featured: true,
        site: 'https://extantword.github.io/activation-space-projections/', preview: 'previews/activation-space-projections.webp' },
      { name: 'AtarraIA.github.io', owner: 'AtarraIA', title: { es: 'AtarraIA', en: 'AtarraIA' }, featured: true,
        site: ATARRAIA, preview: 'previews/atarraia.webp' },
    ]},
  ];

  // Snapshot from the GitHub API (language, last push); refreshed live below.
  const META = {
    'diff-geo': ['TypeScript', '2026'], 'interactive-diff-geo': ['HTML', '2026'], 'sandbox': ['HTML', '2026'],
    'activation-space-projections': ['HTML', '2026'], 'AtarraIA.github.io': ['HTML', '2026'],
  };

  const USER = 'Extantword';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pick = (v, lang) => (v && typeof v === 'object') ? v[lang] : v;
  let LANG = 'es';

  function card(r) {
    const t = TEXT[LANG], title = pick(r.title, LANG) || r.name, site = pick(r.site, LANG);
    const [lang, year] = META[r.name] || ['', ''];
    const meta = [lang, year, r.stars ? '★ ' + r.stars : ''].filter(Boolean).map(esc).map(x => '<span>' + x + '</span>').join('');
    return '<article class="card' + (r.featured ? ' featured' : '') + '">' +
      (r.preview && site ? '<a class="shot" href="' + esc(site) + '" tabindex="-1" aria-hidden="true">' +
        '<img src="' + esc(r.preview) + '" alt="' + esc(t.preview + title) + '" width="800" height="500" loading="lazy"></a>' : '') +
      '<div class="body">' +
      '<h3>' + esc(title) + '</h3>' +
      '<div class="meta">' + meta + '</div>' +
      '<div class="links">' +
        (site ? '<a class="site" href="' + esc(site) + '">' + t.site + '</a>' : '') +
        '<a href="https://github.com/' + esc(r.owner || USER) + '/' + esc(r.name) + '">' + t.code + '</a>' +
      '</div></div></article>';
  }

  function render() {
    const t = TEXT[LANG];
    document.documentElement.lang = LANG;
    document.querySelector('meta[name="description"]').content = t.description;
    document.getElementById('lead').innerHTML = esc(t.lead).replace('{atarraia}', '<a href="' + ATARRAIA[LANG] + '">AtarraIA</a>');
    const toggle = document.getElementById('lang-toggle');
    toggle.textContent = t.toggle;
    toggle.lang = t.toggle.toLowerCase();
    toggle.setAttribute('aria-label', t.toggleLabel);

    document.getElementById('groups').innerHTML = GROUPS.map(g =>
      '<section id="' + g.id + '"><h2>' + esc(pick(g.title, LANG)) + '<span class="n">' + g.repos.length + '</span></h2>' +
      (g.blurb ? '<p class="blurb">' + esc(pick(g.blurb, LANG)) + '</p>' : '') +
      '<div class="grid">' + g.repos.map(card).join('') + '</div></section>').join('');
    const topics = document.getElementById('topics');
    topics.setAttribute('aria-label', t.topics);
    topics.innerHTML = GROUPS.map(g =>
      '<a href="#' + g.id + '">' + esc(pick(g.title, LANG)) + '<span class="n">' + g.repos.length + '</span></a>').join('');
  }

  // ?lang=en opens the page in English (the button keeps it in the address); otherwise the last choice is remembered.
  const asked = new URLSearchParams(location.search).get('lang');
  if (asked in TEXT) LANG = asked;
  else { try { if (localStorage.getItem('lang') === 'en') LANG = 'en'; } catch (e) {} }

  document.getElementById('lang-toggle').addEventListener('click', () => {
    LANG = LANG === 'en' ? 'es' : 'en';
    try { localStorage.setItem('lang', LANG); } catch (e) {}
    const url = new URL(location.href);
    if (LANG === 'en') url.searchParams.set('lang', 'en'); else url.searchParams.delete('lang');
    history.replaceState(null, '', url);
    render();
  });

  render();

  // Refresh languages, years and stars from GitHub.
  fetch('https://api.github.com/users/' + USER + '/repos?per_page=100')
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(live => {
      live.forEach(r => {
        META[r.name] = [(r.language || '').replace('Jupyter Notebook', 'Jupyter').replace('Roff', 'LaTeX'), r.pushed_at.slice(0, 4)];
        GROUPS.forEach(g => g.repos.forEach(x => { if (x.name === r.name) x.stars = r.stargazers_count; }));
      });
      render();
    })
    .catch(() => {});
</script>
</body>
</html>
