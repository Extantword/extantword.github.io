<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joan · Proyectos</title>
<meta name="description" content="Proyectos de Joan (Extantword): matemáticas, aprendizaje automático, datos abiertos de Medellín y herramientas para el navegador.">
<style>
  @font-face { font-family: "KaTeX_Main"; src: url(fonts/KaTeX_Main-Regular.woff2) format("woff2"); font-style: normal; font-weight: 400; }
  @font-face { font-family: "KaTeX_Main"; src: url(fonts/KaTeX_Main-Italic.woff2) format("woff2"); font-style: italic; font-weight: 400; }

  :root {
    color-scheme: light;
    --page: #ffffff;
    --ink: #1b1d22;
    --soft: #5d636c;
    --muted: #8a919b;
    --line: #1b1d221c;
    --tint: #f7f7f5;
    --highlight: #e56a00;
    --highlight-soft: #f2730512;
    --serif: "KaTeX_Main", "Latin Modern Roman", "Iowan Old Style", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--page); color: var(--ink); margin: 0; }
  body { font-family: var(--serif); padding: 0 16px; padding-block: 9vh 8vh; }
  .wrap { max-width: 72rem; margin: 0 auto; }

  header { max-width: 44rem; }
  .eyebrow { font-family: var(--sans); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }
  h1 { font-weight: 400; font-size: clamp(40px, 6vw, 76px); line-height: 1.02; margin: 0; letter-spacing: -.01em; }
  h1 i { color: var(--highlight); }
  .lead { font-size: clamp(19px, 1.9vw, 25px); line-height: 1.45; color: var(--soft); margin: 1rem 0 0; text-wrap: pretty; }
  .profile { font-family: var(--sans); font-size: 14px; margin-top: 1.2rem; display: flex; gap: .4rem 1.2rem; flex-wrap: wrap; }
  .profile a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .profile a:hover { color: var(--highlight); border-color: var(--highlight); }

  nav.topics { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(6px);
    margin: 3.5rem -16px 0; padding: .8rem 16px; border-bottom: 1px solid var(--line); display: flex; gap: .4rem; flex-wrap: wrap; font-family: var(--sans); font-size: 14px; }
  nav.topics a { color: var(--soft); text-decoration: none; padding: .3rem .75rem; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  nav.topics a:hover { color: var(--highlight); border-color: var(--highlight); }
  nav.topics .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: .3rem; }

  section { margin-top: 3.2rem; scroll-margin-top: 4.5rem; }
  section > h2 { font-weight: 400; font-size: clamp(26px, 2.6vw, 36px); margin: 0; display: flex; align-items: baseline; gap: .6rem; }
  section > h2 .n { font-family: var(--sans); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  section > p.blurb { color: var(--soft); font-size: 18px; margin: .3rem 0 0; max-width: 44rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: 1rem; margin-top: 1.2rem; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 1.1rem 1.2rem 1rem; display: flex; flex-direction: column; gap: .55rem; background: var(--page); transition: border-color .2s; }
  .card:hover { border-color: #1b1d2240; }
  .card.featured { border-top: 3px solid var(--highlight); }
  .card h3 { font-weight: 400; font-size: 23px; line-height: 1.2; margin: 0; overflow-wrap: anywhere; }
  .card p { margin: 0; font-size: 17px; line-height: 1.45; color: var(--soft); flex: 1; }
  .meta { font-family: var(--sans); font-size: 13px; color: var(--muted); display: flex; gap: .35rem .9rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .links { font-family: var(--sans); font-size: 14px; display: flex; gap: 1rem; margin-top: .2rem; }
  .links a { text-decoration: none; color: var(--soft); }
  .links a.site { color: var(--highlight); font-weight: 500; }
  .links a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .links a:focus-visible, nav.topics a:focus-visible, .profile a:focus-visible { outline: 2px solid #f2730580; outline-offset: 2px; border-radius: 3px; }

  footer { margin-top: 4.5rem; padding-top: 1.2rem; border-top: 1px solid var(--line); font-family: var(--sans); font-size: 13px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Extantword</p>
    <h1>Joan<i>.</i></h1>
    <p class="lead">Matemáticas, aprendizaje automático y herramientas para el navegador. Aquí están todos mis proyectos públicos, con enlace al sitio cuando lo tienen.</p>
    <div class="profile">
      <a href="https://github.com/Extantword">github.com/Extantword</a>
      <a href="https://extantword.github.io/joan.github.io/">Blog</a>
    </div>
  </header>

  <nav class="topics" id="topics" aria-label="Temas"></nav>
  <main id="groups"></main>

  <footer>
    La lista se actualiza sola: los repositorios públicos nuevos aparecen en “Nuevos”.
  </footer>
</div>

<script>
  // Curated list: one entry per public repo. `site` is its live page, when it has one.
  const GROUPS = [
    { id: 'matematicas', title: 'Matemáticas', blurb: 'Geometría diferencial, probabilidad y métodos numéricos, casi siempre como algo que se puede mirar y tocar.', repos: [
      { name: 'diff-geo', title: 'Geometría diferencial interactiva', featured: true, site: 'https://extantword.github.io/diff-geo/',
        desc: 'Curvas y superficies en R³, siguiendo a do Carmo. WebGL2 escrito a mano y un sistema de álgebra computacional en TypeScript.' },
      { name: 'interactive-diff-geo', title: 'Superficies regulares', featured: true, site: 'https://extantword.github.io/interactive-diff-geo/',
        desc: 'Las diapositivas del seminario sobre superficies regulares (do Carmo, cap. 2): las figuras se giran con el ratón y la página dibuja lo que dicen las fórmulas.' },
      { name: 'sandbox', title: 'Sandbox', featured: true, site: 'https://extantword.github.io/sandbox/',
        desc: 'Diapositivas de la charla sobre sandboxes: qué son, por qué de ellos surge lo inesperado y cómo diseñarlos, con el paseo de los primos, el juego de la vida y autómatas de Wolfram funcionando dentro.' },
      { name: 'interactive-algebra', title: 'Algebra Sandbox', featured: true, site: 'https://extantword.github.io/interactive-algebra/',
        desc: 'Una pizarra para hacer álgebra y cálculo a mano alzada: se escribe una expresión, se encierra en un círculo y se vuelve matemática que se puede tocar, arrastrar y transformar.' },
      { name: 'inferencia-parcial1', title: 'Inferencia estadística: parcial 1', featured: true, site: 'https://extantword.github.io/inferencia-parcial1/',
        desc: 'Los 22 ejercicios del parcial resueltos paso a paso como diapositivas: estadísticos de orden y convergencia.' },
      { name: 'Traduccion-proofs-and-fundamentals', title: 'Proofs and Fundamentals, en español',
        desc: 'Traducción no oficial del libro de Ethan Bloch, hecha por estudiantes de la Universidad Nacional de Colombia.' },
      { name: 'metodos-numericos', title: 'Métodos numéricos',
        desc: 'Cuadernos de Jupyter con interpolación polinómica, diferenciación e integración numérica, sistemas lineales, EDO y regresión.' },
      { name: 'polinomios', title: 'Polinomios',
        desc: 'Trabajo de álgebra computacional sobre polinomios, en Python.' },
      { name: 'Algebra_lineal', title: 'Álgebra lineal',
        desc: 'Cuadernos de Jupyter sobre matrices.' },
    ]},
    { id: 'aprendizaje', title: 'Aprendizaje automático', blurb: 'Redes neuronales, visión por computador y el material de los semilleros.', repos: [
      { name: 'activation-space-projections', title: 'Proyecciones del espacio latente', featured: true, site: 'https://extantword.github.io/activation-space-projections/',
        desc: 'Autoencoders convolucionales cuyo espacio latente se proyecta en 3D con PCA y UMAP: 45 experimentos con visualizaciones interactivas.' },
      { name: 'skysense', title: 'SkySense',
        desc: 'Detección de objetos en imágenes tomadas desde drones, con YOLOv8 entrenado en VisDrone.' },
      { name: 'NASASPACEAPPS-EXO', title: 'Exoplanet Explorer',
        desc: 'Para el NASA Space Apps Challenge 2025: buscar y analizar exoplanetas de Kepler, TESS y K2, con curvas de luz y modelos de aprendizaje automático.' },
      { name: 'Semillero-Redes-Neuronales', title: 'Semillero de Redes Neuronales',
        desc: 'Material del semillero: el marco formal del aprendizaje automático, redes en PyTorch y experimentos.' },
      { name: 'semillero-redes-neuronales-unalmed.github.io', title: 'Sitio del semillero', site: 'https://extantword.github.io/semillero-redes-neuronales-unalmed.github.io/',
        desc: 'La página web del Semillero de Redes Neuronales.' },
      { name: 'atarraia', title: 'AtarraIA',
        desc: 'Recursos del semillero AtarraIA: autoencoders, sobreajuste y grafos, en cuadernos de Jupyter.' },
      { name: 'atarraia-practica1', title: 'AtarraIA: práctica 1',
        desc: 'Primera práctica del semillero: redes neuronales en PyTorch.' },
      { name: 'tarea-2-aprendizaje-automatico', title: 'Aprendizaje automático: tarea 2',
        desc: 'Clustering, autoencoders y vision transformers.' },
      { name: 'UNASTRO4', title: 'UNASTRO4',
        desc: 'Experimentos con SAM y Stable Diffusion.' },
    ]},
    { id: 'medellin', title: 'Medellín y datos abiertos', blurb: 'Datos públicos de la ciudad, reunidos y puestos a la vista.', repos: [
      { name: 'datos-abiertos-medellin', title: 'Datos Abiertos de Medellín', featured: true, site: 'https://extantword.github.io/datos-abiertos-medellin/',
        desc: 'Un solo portal para Medata, Metropol, Metro, GeoMedellín y datos.gov.co.' },
      { name: 'Climed', title: 'MedCity Dashboard', site: 'https://extantword.github.io/Climed/',
        desc: 'Riesgo de inundaciones, calidad del aire y siniestralidad vial por barrio, con datos en tiempo real.' },
    ]},
    { id: 'simulacion', title: 'Simulación', blurb: 'Modelos físicos, en el navegador y en Python.', repos: [
      { name: 'physics-simulations', title: 'Simulaciones de física', site: 'https://extantword.github.io/physics-simulations/',
        desc: 'Fluidos, péndulo y ondas, en el navegador.' },
      { name: 'fede', title: 'Torre de secado por aspersión',
        desc: 'Simulación de una torre de secado por aspersión a partir de un modelo fenomenológico, en Python.' },
    ]},
    { id: 'herramientas', title: 'Herramientas y otros', blurb: 'Utilidades, juegos y ejercicios de programación.', repos: [
      { name: 'Latte', title: 'Latte', site: 'https://extantword.github.io/Latte/',
        desc: 'Editor de LaTeX liviano y estético, con vista previa en tiempo real, en el navegador.' },
      { name: 'joan.github.io', title: 'Blog', site: 'https://extantword.github.io/joan.github.io/',
        desc: 'Mi blog.' },
      { name: 'WololoBot', title: 'WololoBot',
        desc: 'Bot de Discord que reproduce en el canal de voz los audios de Age of Empires II.' },
      { name: 'Easy-screenshot', title: 'Easy-screenshot',
        desc: 'Script de Python para tomar capturas de pantalla sin tener que decidir dónde guardarlas.' },
      { name: 'snakeunal', title: 'Snake',
        desc: 'El juego de la serpiente, en Python.' },
      { name: 'node-tut', title: 'Tutorial de Node.js',
        desc: 'Ejercicios hechos siguiendo un tutorial de Node.js.' },
      { name: 'ListasGeneralizadas', title: 'Listas generalizadas',
        desc: 'Estructura de datos de listas generalizadas, en Java.' },
      { name: 'Taller5', title: 'Taller 5',
        desc: 'Taller de programación en Java.' },
      { name: 'claude-test', title: 'claude-test',
        desc: 'Repositorio para probar funcionalidades de Claude Code.' },
    ]},
  ];

  // Snapshot from the GitHub API (language, last push); refreshed live below.
  const META = {
    'sandbox': ['TypeScript', '2026'], 'interactive-algebra': ['JavaScript', '2026'], 'inferencia-parcial1': ['HTML', '2026'], 'interactive-diff-geo': ['HTML', '2026'], 'diff-geo': ['TypeScript', '2026'],
    'joan.github.io': ['HTML', '2026'], 'datos-abiertos-medellin': ['HTML', '2026'], 'Climed': ['JavaScript', '2026'],
    'atarraia': ['Jupyter', '2026'], 'fede': ['Python', '2026'], 'skysense': ['Jupyter', '2026'], 'Latte': ['JavaScript', '2026'],
    'activation-space-projections': ['HTML', '2026'], 'physics-simulations': ['HTML', '2026'], 'atarraia-practica1': ['Jupyter', '2026'],
    'claude-test': ['', '2026'], 'semillero-redes-neuronales-unalmed.github.io': ['HTML', '2025'], 'Semillero-Redes-Neuronales': ['Jupyter', '2025'],
    'NASASPACEAPPS-EXO': ['Python', '2025'], 'tarea-2-aprendizaje-automatico': ['Jupyter', '2025'], 'UNASTRO4': ['Jupyter', '2023'],
    'snakeunal': ['Python', '2023'], 'polinomios': ['Python', '2023'], 'node-tut': ['JavaScript', '2021'], 'metodos-numericos': ['Jupyter', '2021'],
    'WololoBot': ['Python', '2021'], 'Traduccion-proofs-and-fundamentals': ['LaTeX', '2021'], 'Taller5': ['Java', '2020'],
    'ListasGeneralizadas': ['Java', '2020'], 'Algebra_lineal': ['Jupyter', '2020'], 'Easy-screenshot': ['Python', '2020'],
  };

  const USER = 'Extantword';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function card(r) {
    const [lang, year] = META[r.name] || ['', ''];
    const meta = [lang, year, r.stars ? '★ ' + r.stars : ''].filter(Boolean).map(esc).map(t => '<span>' + t + '</span>').join('');
    return '<article class="card' + (r.featured ? ' featured' : '') + '">' +
      '<h3>' + esc(r.title || r.name) + '</h3>' +
      '<p>' + esc(r.desc || 'Sin descripción.') + '</p>' +
      '<div class="meta">' + meta + '</div>' +
      '<div class="links">' +
        (r.site ? '<a class="site" href="' + esc(r.site) + '">Ver sitio ↗</a>' : '') +
        '<a href="https://github.com/' + USER + '/' + esc(r.name) + '">Código</a>' +
      '</div></article>';
  }

  function render(groups) {
    document.getElementById('groups').innerHTML = groups.map(g =>
      '<section id="' + g.id + '"><h2>' + esc(g.title) + '<span class="n">' + g.repos.length + '</span></h2>' +
      (g.blurb ? '<p class="blurb">' + esc(g.blurb) + '</p>' : '') +
      '<div class="grid">' + g.repos.map(card).join('') + '</div></section>').join('');
    document.getElementById('topics').innerHTML = groups.map(g =>
      '<a href="#' + g.id + '">' + esc(g.title) + '<span class="n">' + g.repos.length + '</span></a>').join('');
  }

  render(GROUPS);

  // Refresh languages, years and stars from GitHub, and add repos not in the curated list.
  fetch('https://api.github.com/users/' + USER + '/repos?per_page=100')
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(live => {
      const known = new Set(GROUPS.flatMap(g => g.repos.map(r => r.name)));
      const fresh = [];
      live.filter(r => !r.fork && !r.private).forEach(r => {
        META[r.name] = [(r.language || '').replace('Jupyter Notebook', 'Jupyter').replace('Roff', 'LaTeX'), r.pushed_at.slice(0, 4)];
        GROUPS.forEach(g => g.repos.forEach(x => { if (x.name === r.name) x.stars = r.stargazers_count; }));
        if (!known.has(r.name)) fresh.push({ name: r.name, desc: r.description, stars: r.stargazers_count,
          site: r.has_pages ? 'https://' + USER.toLowerCase() + '.github.io/' + r.name + '/' : (r.homepage || '') });
      });
      const groups = fresh.length
        ? [{ id: 'nuevos', title: 'Nuevos', blurb: 'Repositorios recientes que todavía no tienen su lugar en la lista.', repos: fresh }, ...GROUPS]
        : GROUPS;
      render(groups);
    })
    .catch(() => {});
</script>
</body>
</html>
